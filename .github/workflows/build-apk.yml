name: Baby Movement Counter — Debug APK

on:
  push:
    branches:
      - main
      - baby-movement-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: counterapp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sdkmanager --version

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Name APK and create ZIP with build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_NAME="Baby-Movement-Counter-Debug-APK-${BUILD_NUMBER}.apk"
          ZIP_NAME="Baby-Movement-Counter-Debug-APK-${BUILD_NUMBER}.zip"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          (cd dist && zip -9 "${ZIP_NAME}" "${APK_NAME}")
          test -s "dist/${APK_NAME}"
          test -s "dist/${ZIP_NAME}"
          ls -lh dist/

      - name: Upload named APK and ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baby Movement Counter — Debug APK (Build ${{ github.run_number }})
          path: |
            dist/*.apk
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
